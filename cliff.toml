# git-cliff configuration — https://git-cliff.org/docs/configuration
# Regenerate everything:   npx git-cliff -o CHANGELOG.md
# Before tagging vX.Y.Z:   npx git-cliff --tag vX.Y.Z -o CHANGELOG.md
# Release notes (CI):      npx git-cliff --latest --strip header

[remote.github]
owner = "championswimmer"
repo = "pi-extension-settings-tui"

[changelog]
header = """
# Changelog

All notable changes to `pi-extension-settings-tui` are documented here.
Entries are generated from git history by [git-cliff](https://git-cliff.org) on every release.
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and this project follows [Semantic Versioning](https://semver.org/)."""
body = """
{%- macro repo() -%}https://github.com/championswimmer/pi-extension-settings-tui{%- endmacro -%}
{%- if version and previous.version %}
## [{{ version | trim_start_matches(pat="v") }}]({{ self::repo() }}/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{%- elif version %}
## [{{ version | trim_start_matches(pat="v") }}]({{ self::repo() }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else %}
## [Unreleased]
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
  {% if commit.breaking %}**BREAKING:** {% endif %}\
  {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
  {% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}]({{ self::repo() }}/pull/{{ commit.remote.pr_number }})){% endif %}\
  {{ " " }}([{{ commit.id | truncate(length=7, end="") }}]({{ self::repo() }}/commit/{{ commit.id }}))\
{%- endfor %}
{% endfor %}
{%- set prs = commits | filter(attribute="remote.pr_number") -%}
{% if prs | length > 0 %}
### Pull Requests
{% for commit in prs %}
- [#{{ commit.remote.pr_number }}]({{ self::repo() }}/pull/{{ commit.remote.pr_number }}) {{ commit.remote.pr_title | default(value=commit.message | split(pat="\n") | first) }}\
{%- endfor %}
{% endif %}
"""
footer = """

<!-- generated by git-cliff -->"""
# Normalise whitespace so every release section is separated by exactly one blank line.
postprocessors = [
  { pattern = '\n{3,}', replace = "\n\n" },
  { pattern = '^\s+', replace = "\n" },
  { pattern = '\s+$', replace = "\n" },
]
trim = false

[git]
conventional_commits = true
# Keep non-conventional commits too ("all commits"), grouped under Other Changes.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
topo_order = false
sort_commits = "oldest"
commit_preprocessors = [
  # Squash-merge subjects end in "(#123)"; drop it (PR is linked separately).
  { pattern = '\s*\(#([0-9]+)\)\s*$', replace = "" },
]
# git-cliff default groups (from `git cliff --init`), plus a skip for this repo's
# `chore(release): vX.Y.Z` bump commits.
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge pull request", skip = true },
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
  { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
  { message = "^style", group = "<!-- 5 -->🎨 Styling" },
  { message = "^test", group = "<!-- 6 -->🧪 Testing" },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore|^ci", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
  { body = ".*security", group = "<!-- 8 -->🛡️ Security" },
  { message = "^revert", group = "<!-- 9 -->◀️ Revert" },
  { message = ".*", group = "<!-- 10 -->💼 Other" },
]
